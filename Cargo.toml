[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
whir-core = { path = "crates/whir-core" }
whir-platform = { path = "crates/whir-platform" }
whir-gfx = { path = "crates/whir-gfx" }
whir-image = { path = "crates/whir-image" }
whir-pdf = { path = "crates/whir-pdf" }
whir-csv = { path = "crates/whir-csv" }
whir-notes = { path = "crates/whir-notes" }
whir-capture = { path = "crates/whir-capture" }

# Pinned to the version rerun's re_ui uses, so its theming can be vendored later.
egui = { version = "=0.36.2", default-features = false, features = ["bytemuck"] }
memchr = "2.8"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

# Keep debug builds usable: optimize dependencies (egui, windows) but not our own crates.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
